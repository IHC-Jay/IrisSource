
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: white;">
    <as-split direction="vertical">
      <as-split-area [size]="40" minSize="10" maxSize="60">

      <table align="left" style="font-size: 10px;">
        <tr style="font-size: 10px; ">

          <td class="form-group col-2" style="font-size: 10px; ">


              <mat-form-field>
                <mat-label>Enter a date range</mat-label>
                <mat-date-range-input [rangePicker]="picker">
                  <input matStartDate formControlName="matStartDate" placeholder="Start date" >
                  <input matEndDate formControlName="matEndDate" placeholder="End date">
                </mat-date-range-input>
                <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker [startAt]="startDate"></mat-date-range-picker>
              </mat-form-field>

            </td>

          <td class="form-group col-2" style="font-size: 10px;">
            <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >
              <mat-label style="font-size: 10px; ">Count</mat-label>
              <mat-select formControlName="rowCnt"
              [multiple]="false" >
                <mat-option *ngFor="let rowCnt of maxCount" [value]="rowCnt" style="font-size: 10px;">
                  {{rowCnt}}
                </mat-option>
              </mat-select>
            </mat-form-field>

          </td>

          <td class="form-group col-2" style="font-size: 10px;; ">
            <mat-form-field appearance="fill" style="margin-left: 10px;" >
              <mat-label style="font-size: 10px; ">Transaction type</mat-label>
              <mat-select formControlName="transType" (selectionChange)="transactionChange($event.value)"
              [multiple]="false" >
                <mat-option *ngFor="let transType of transactionTypes" [value]="transType" style="font-size: 10px;">
                  {{transType}}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <div *ngIf="submitted && f.transType.errors" class="invalid-feedback">
              <div *ngIf="f.transType.errors.required">TransType is required</div>
            </div>
            </td>

            <td class="form-group col-2" style="font-size: 10px;; ">

                <mat-radio-group aria-label="Select an option" formControlName="isaOrSt">
                  <mat-radio-button value="ST" [checked]='true'>Transactions</mat-radio-button>
                  <mat-radio-button value="ISA" >Files</mat-radio-button>
                </mat-radio-group>


              </td>

            <td>


            <button  class="btn btn-primary" style="background-color: navy;" (click)="onSearchTransactions()">
              Search Transactions
            </button>
          </td>


        </tr>
        </table>
        <table align="left">

      <tr>

    <!-- Search Static -->
    <div class="form-row">
        <table>
          <HR style="border: 1pt; border-color: blue;" />
          <tr>

            <td  class="form-group col-2"  >

                    <label  class="searchLbl">Trading Partner: </label>

                    <mat-select formControlName="TradingPartner" (selectionChange)="tpChange()"  class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif; background-color: white; width: 250pt;"
                    [multiple]="false" >
                      <mat-option *ngFor="let tpName of tpDataSource" [value]="tpName" class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif; width: fit-content; background-color: white;">
                        {{tpName}}
                      </mat-option>
                    </mat-select>

              </td>

          </tr>

        </table>
     </div>


    </tr>
    <tr style="width: 100%;">
      <HR style="border: 1pt; border-color: blue;" />
    <!-- Search -->
    <table>
    <tr>

        <td class="form-group col-2" style="font-size: small; width: 10%;">
          <label style="font-family: Calibri, Calibri, serif;">Additional Search Conditions: </label>
        </td>
          <td class="form-group col-2" style="font-size: small; width: 30%;">
          <select formControlName="searchField"  class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif;" >
        <option *ngFor="let fld of searchColumns" [value]="fld.label">{{fld.label}}</option>
      </select>
      </td>
      <td class="form-group col-2" class="form-group col-2" style="font-size: small; width: 10%;">
      <select formControlName="searchCndition"  class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif;">
        <option *ngFor="let con of conditionColumns" [value]="con">{{con}} </option>
      </select>
      </td>
      <td class="form-group col-4" class="form-group col-2" style="font-size: small; width: 30%; ">
      <input type="text" formControlName="searchValue" class="rounded-inputs20 select-select col-md-16"
      style="font-size:small; font-family: Calibri, Calibri, serif; margin-right: 10px;"
       [(ngModel)]="searchValue" />


      <button class="icon" style="background-color: navy; font-family: Calibri, Calibri, serif;"
         [disabled]="loading" class="btn btn-primary" (click)="addSearch()">
          <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
          Add
        </button>



      </td>
      <td class="form-group col-1" style="font-size: small; width: 5%;">
      <button  *ngIf="searchTransaction" class="btn btn-primary" style="background-color: navy; font-family: Calibri, Calibri, serif;"  (click)="clearSearch()">
        Clear
      </button>
      </td>
    </tr>
    </table>

  </tr>

 <tr>

    <!-- Search -->
    <table style="width: 100%;">
    <tr>
  <!-- Information on search -->
      <td  style="font-size: small; text-align: right; width: 5%;">
  <label  *ngIf="searchTransaction" style="font-size: medium; font-family: Calibri, Calibri, serif;" ><b>Search Creteria: </b> </label>
  </td>

    <td class="form-group col-2" style="font-size: small; text-align: left;">
  <label  *ngIf="searchTransaction" style="font-size: small; font-family: Calibri, Calibri, serif;" >{{searchString}}</label>
  </td>
 </tr>
 </table>
 <HR style="border: 1pc; border-color: blue;" />
  </tr>

  <tr>
        <!-- Columns to be displayed  & save -->
        <table style="width: 100%;">
          <tr>
            <td>

              <label style="font-family: Calibri, Calibri, serif; width: 10%;" >{{displayLabel}} </label>
              </td>

              <td style="font-size: small; width: 80%;">
                <div class="selDiv" style="width: 100%;">

                  <ng-multiselect-dropdown class="container"
                  [placeholder]="'Select Columns to display'"
                  [settings]="dropdownSettings"
                  [data]="allDropdownList"
                  [(ngModel)]="selDropdownList"
                  (onSelect)="onItemSelect($event)"
                  (onDeSelect)="onItemDeSelect($event)"
                  [ngModelOptions]="{standalone: true}"
                  >
                </ng-multiselect-dropdown>

              </div>
              </td>

              </tr>
              </table>

   </tr>
   </table>

  </as-split-area>
  <as-split-area [size]="60">

        <div>


            <!-- Transactions -->
            <div style="width:100%;overflow-x:scroll; height: 100%; font-size: small;">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows matSort *ngIf="dataSource.data.length > 0" style="font-size: small;">

                <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                  <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header> {{dataTableLabel[i]}} </th>
                  <td mat-cell *matCellDef="let element" (contextmenu)="onContextMenu($event, element, i)"> {{element[column]}} </td>
                </ng-container>


                <tr class="trans-row" mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >

                </tr>
                <tr style="font-size: smaller;" mat-row class="trans-element-row" *matRowDef="let row; columns: dataTableKey;"

                >

                </tr>

              </table>

              <div style="visibility: hidden; position: fixed"
              [style.left]="contextMenuPosition.x"
              [style.top]="contextMenuPosition.y"
              [matMenuTriggerFor]="contextMenu">
            </div>
              <mat-menu #contextMenu="matMenu" #contextMenu2="matMenu">
                <ng-template matMenuContent let-item="item">
                  <button mat-menu-item (click)="onContextMenuNew(item)">Details in New Tab</button>
                  <button mat-menu-item (click)="onContextMenuSame(item)">Details in Same Window</button>
                </ng-template>
              </mat-menu>

              <div *ngIf="canRenderDetails && dataSource.data.length === 0">No records found for {{f.transType.value}} </div>

            </div>

              <mat-paginator
              [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[10, 20, 30]"
              showFirstLastButtons >
              </mat-paginator>
        </div>



      </as-split-area>
    </as-split>
  </div>

  </form>
