<div *ngIf="canRenderDetails">
<div  class="card" style="width: 30rem;" >
  <!-- <img src="..." class="card-img-top" alt="..."> -->
  <div class="card-body">
      <h5 class="card-title">{{dataSource.data[0]?.TransactionType}}: {{dataSource.data[0]?.Sender}} -> {{dataSource.data[0]?.Receiver}}</h5>
      <!-- <p class="card-text" *ngIf="!dataSource.data[0]?.BHTRefId && dataSource.data[0]?.BHTRefId.length > 1">Batch # {{dataSource.data[0]?.BHTRefId}}</p>
      -->
  </div>
</div>

<button *ngIf="prevWindow === 'true'" class="btn btn-primary" (click)="toTransactions()">
  Back to Transactions
</button>

  <div class="flex-container">
    <div class="mt-2" *ngFor="let item of displayedColumns; let itemIndex = index " >
      <div *ngIf="item.label !== 'erpData'">
      <label for="erpFields" class="col-form-label form-label" >{{itemIndex+1}}. {{item.label}}</label>
      <BR>
        <span class="custom-text-truncate">{{getSelectedValue(itemIndex, item.key)}}</span>
      </div>
    </div>
</div>
<div class="center" *ngIf="ERPDataParentId !== '0'">
  <button mat-flat-button (click)="openERPModal()" mat-raised-button color="primary" style="margin-right: 20px;">
    Display Full ERP</button>


</div>
<div>
    <div *ngFor="let item of displayedColumns; let itemIndex = index ">
      <div class="padding" *ngIf="item.label === 'erpData'">
        <label class="col-form-label form-label" *ngIf="ERPDataParentId !== ''; else elseBlock">Data:</label>
      <ng-template #elseBlock>
        <B>Full ERP:</B>
      </ng-template>
      <BR>

        <span class="custom-text-truncate">{{getSelectedValue(99, item.key)}}</span>
      </div>
    </div>
</div>
</div>
