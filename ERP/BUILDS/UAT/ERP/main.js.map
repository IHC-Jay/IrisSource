
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 100%; background: white;">

        <div class="container">

        <table id="inpTab" style="width: 100%;">
          <tr>
            <td style="width: 10%;">
              <button style="font-size: 12px; margin-right: 10px;" class="btn btn-primary"
               (click)="toWorkFlow()">
                Back to Workflow
              </button>
            </td>
            <td style="width: 70%;">
              <textarea readonly="true" style="height: 50px; width: 80%; font-size: 10px;">{{errorStr}}</textarea>
            </td>

            <td style="width: 10%;">
              <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >
                <mat-label style="font-size: 10px; ">Status</mat-label>
                <mat-select formControlName="statusType" (selectionChange)="statusTypeChange($event.value)"
                style="font-size: 10px;"
                [multiple]="false" >
                  <mat-option *ngFor="let statusType of statusTypes" [value]="statusType" style="font-size: 10px;">
                    {{statusType}}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <div *ngIf="submitted && f.statusType.errors" class="invalid-feedback">
                <div *ngIf="f.statusType.errors.required">Status Type is required</div>
              </div>

            </td><td style="width: 10%;">
              <button style="font-size: 12px;" class="btn btn-primary"
              (click)="updateWF()">
                Update Status
              </button>
            </td>

          </tr>
        </table>

        <table id="butTab">
        <tr>
          <td style="width: 20%;">
          <mat-checkbox style="margin-right:10px;" *ngIf = "maxSelRow > 0"
              [(ngModel)]="checked" (click)="clickChkBox()"
              >
            Show Error Segments Only
          </mat-checkbox >
          </td>
          <td style="width: 10%;">
          <button (click)="SelectNextError()" *ngIf ="!checked && selectedRow < maxSelRow" style="margin-right:10px;" >
            Next Error
          </button>
          </td><td>
          <button (click)="SelectPrevError()" *ngIf ="!checked && selectedRow > minSelRow">
            Previous Error
          </button>
        </td>

          </tr>

        </table>
      </div>

    <!-- TO MAKE TABLE SIZE FIXED  <section class="table-container mat-elevation-z8" tabindex="0"> -->
          <table id="wftab" mat-table [dataSource]="dataSource" multiTemplateDataRows matSort
                  *ngIf="dataSource.data.length > 0"
                  style="font-size: small; font-family:sans-serif;
                  "
                  >

                    <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                      <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header>
                        {{dataTableLabel[i]}} </th>
                      <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                    </ng-container>


                    <tr class="trans-row" mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >
                    </tr>

                    <tr style="font-size: smaller; font-family:'Courier New', Courier, monospace;height: 10pt; "
                    mat-row [ngClass]="{'make-gold': row.error !== '', 'selected': !checked && row.lnNum === selectedRow}"
                    class="trans-element-row" *matRowDef="let row; columns: dataTableKey;" (click)="OnRowClick(row)"
                     >
                    </tr>


                    </table>
                    <div> # of Segments  {{dataSource.data.length}}</div>
                    <div *ngIf="canRenderDetails && dataSource.data.length === 0">No records found for {{f.transType.value}} </div>



            <mat-paginator
            [length]="100"
            [pageSize]="10"
            [pageSizeOptions]="[10, 20, 30]"
            showFirstLastButtons >
            </mat-paginator>
       <!--  </section> -->


  </div>
</form>
