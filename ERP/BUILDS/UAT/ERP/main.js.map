<div mat-dialog-content>

      <span class="custom-text-truncate" style="white-space: pre-wrap; font-family: courier, Helvetica, sans-serif;"  >{{erpData}}</span>


</div>
<div mat-dialog-actions>
  <label style=" margin-right:10px; margin-left:10px;" *ngIf="fileName !== '' && fileName !== 'NA' ">FileName:</label>
  <input type="text" style="font-size: small; width: 40%; border-spacing: 10pt; line-height: 20px; " *ngIf="fileName !== '' && fileName !== 'NA' " [(ngModel)]="fileName" />
  <button mat-button cdkFocusInitial style=" margin-right:20px; margin-left:20px;" *ngIf="fileName !== '' && fileName !== 'NA' " (click)="save()">Save</button>
  <button mat-button [mat-dialog-close]="true">Close</button>
</div>
