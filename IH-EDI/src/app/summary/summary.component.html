
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: azure; ">
    <table style="font-size: 5px; background-color: azure; border-style: groove;border-width: thin; max-width: fit-content; ">
      <tr style="font-size: 10px; vertical-align:top" >
          <table style="background-color: azure; max-width:1200px;">
            <tr style="font-size: 10px; vertical-align:top" >

              <!-- Date Time -->

                <td class="form-group col-1" style="font-size: 10px; align-self:safe;" >
                  <label>Process Start Date & Time</label>
                  <div  style="border-color: gray;border-style: dashed; border-width: thin; background-color: azure;">

                      <mat-form-field style="align-items: center; align-self:center; align-content: center;">

                        <input matInput  name="startDate" type="date" style="font-size: 10px;"
                        value="{{startDate}}"
                        placeholder="mm-dd-yyyy" required (change)="onStDateChange($event)"/>

                    </mat-form-field>
                    <mat-form-field >

                      <input type="time" style="font-size: 10px;" matInput name="startTm"
                    value="{{startTm}}" (change)="onStTimeChange($event)"
                      />

                  </mat-form-field>
                  </div>
                </td>

                <td class="form-group col-1" style="font-size: 10px; align-self:safe;" >
                  <label>Process End Date & Time</label>
                  <div style="border-color: gray;border-style: dashed; border-width: thin; background-color: azure;">


                  <mat-form-field >

                    <input type="date" style="font-size: 10px;" matInput name="endDate"
                    value="{{endDate}}" (change)="onEndDateChange($event)"/>

                        </mat-form-field>
                        <mat-form-field >

                          <input type="time" style="font-size: 10px; " matInput name="endTm"
                        value="{{endTm}}" (change)="onEndTimeChange($event)"/>

                        </mat-form-field>
                    </div>
                </td>

                <!-- Transaction type     -->


                <td class="form-group col-1" style="font-size: 10px; align-self:safe;" >
                  <table style="font-size: 10px; align-self:safe;border-color: gray; border-style: dashed; border-width: thin; background-color: azure;">
                      <tr>
                        <td>
                        <label style="font-size: 10px; text-align: left ;">Transaction type</label>
                      </td>
                      </tr>
                      <tr>
                      <td>

                        <mat-form-field  appearance="fill" style="font-size: 10px; " >

                          <mat-select style="font-size: 10px;" formControlName="transType" (selectionChange)="transactionChange($event.value)"
                          [multiple]="false" >
                            <mat-option *ngFor="let transType of transactionTypes" [value]="transType" style="font-size: 10px;">
                              {{transType}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field>

                        </td>
                      </tr>

                      <tr>
                        <td>

                          <label style="font-size: 10px; text-align: left ;">Disposition</label>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <mat-form-field appearance="fill" style="font-size: 10px; " >

                            <mat-select style="font-size: 10px;" formControlName="disposition"
                            [multiple]="false" >
                              <mat-option *ngFor="let disposition of dispositions" [value]="disposition" style="font-size: 10px;">
                                {{disposition}}
                              </mat-option>
                            </mat-select>
                          </mat-form-field>
                        </td>
                      </tr>
                  </table>
                </td>

                <td class="form-group col-1" style="font-size: 10px; align-self:safe;">
                  <table class="form-group col-1" style="font-size: 10px;border-color: gray; border-style: dashed; border-width: thin; background-color: azure;">
                    <tr *ngIf="showMode">
                      <td>
                        <label style="font-size: 10px;text-align: left ;">Mode</label>
                        <div style="font-size: 5px;">

                        <mat-radio-group style="font-size: 10px;"  formControlName="mode" (change)="transactionChange($event.value)">
                          <mat-radio-button  style="font-size: 10px;" value="RealTime">RealTime</mat-radio-button>
                          <mat-radio-button  style="font-size: 10px;" value="Batch">Batch</mat-radio-button>
                        </mat-radio-group>
                        </div>
                      </td>
                    </tr>

                    <tr *ngIf="showDirection">
                      <td>
                        <label style="font-size: 10px;text-align: left ;">Direction</label>
                        <div style="font-size: 5px;">

                        <mat-radio-group style="font-size: 10px;"  formControlName="direction" (change)="transactionChange($event.value)">
                          <mat-radio-button  style="font-size: 10px;" value="Inbound">Inbound</mat-radio-button>
                          <mat-radio-button  style="font-size: 10px;" value="Outbound">Outbound</mat-radio-button>
                        </mat-radio-group>
                        </div>
                      </td>
                    </tr>

                  </table>

                </td>

                <td class="form-group col-2" style="font-size: 10px;" >
                  <table style="font-size: small; background-color: azure; ">
                    <tr>
                        <td >
                          <label style="font-size: 10px; text-align: left ; max-width: 100px;">Items per page</label>
                        </td>
                        <td style="text-align: center;">
                          <div *ngIf="canRenderDetails && dataSource.data.length > 0">

                          <button class="btn-act" (click)="exportData()" type="button">
                            <mat-icon><span class="material-icons">
                              file_download
                              </span></mat-icon>
                            Export to File
                          </button>

                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <mat-form-field appearance="fill" style="font-size: 8px; width: fit-content; max-width: 100px;" >

                            <mat-select style="font-size: 10px;" formControlName="rowCnt"  (selectionChange)="onRowCnt()"
                            [multiple]="false" >
                              <mat-option *ngFor="let rowCnt of maxCount" [value]="rowCnt" style="font-size: 10px;">
                                {{rowCnt}}
                              </mat-option>
                            </mat-select>
                          </mat-form-field>
                        </td>



                      </tr>
                      <tr>

                        <td style="align-self: center; vertical-align: bottom;">
                          <button  class="btn btn-primary" style="background-color: navy; font-size: 18px; width: 100px; align-self: center; vertical-align: bottom;"
                          type="submit" (click)="onSearchSummary(); ">
                            Search  </button>
                        </td>


                      </tr>
                  </table>
                </td>


              </tr>
            </table>

          </tr>


          <tr style="font-size: 5px; background-color: azure; border-style: groove;border-width: thin; ">

            <!-- Custom Fields -->
            <table class="form-group col-2" style="font-size: 10px; background-color: azure;">
              <div formArrayName="additional" style="font-size: 5px; background-color: azure; border-style: groove;border-width: thin; ">
                <tr style="font-size: 5px; background-color: azure; border-style: groove;border-width: thin; ">

                  <td *ngFor="let newFld of form.get('additional')['controls']; let i = index" [formGroupName]="i">
                    <label class="searchLbl"> {{newFld.get('fld').value}}</label>
                    <input style="font-size: x-small; padding-right: 40pt; margin-right: 10pt;"
                    type="text" matInput formControlName="newFldValue" placeholder="Value for {{newFld.get('fld').value}}">
                  </td>



                </tr>
            </div>
            </table>
          </tr>


            <tr style="font-size: 5px; background-color: cyan; border-style: groove;border-width: thin; "></tr>

            <tr *ngIf="canRenderDetails" style="font-size: 5px; background-color: azure; border-style: groove;border-width: thin; ">


              <div>
                <hr>

                  <!-- Transactions -->
                  <div style="width:100%;overflow-x:scroll; height: 100%; font-size: small; background-color: azure;">

                    <mat-form-field style="font-size: smaller;">
                      <mat-label style="font-size: smaller;">Filter</mat-label>
                      <input style="font-size: smaller;" matInput (keyup)="applyFilter($event)" placeholder="Ex. SelectHealth" #input>
                    </mat-form-field>


                    <table mat-table [dataSource]="dataSource" multiTemplateDataRows matSort *ngIf="dataSource.data.length > 0"

                    style="font-size: small; background-color: azure;">

                      <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                        <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header> {{dataTableLabel[i]}} </th>
                        <td mat-cell *matCellDef="let element" (contextmenu)="onContextMenu($event, element, i)"  > {{element[column]}} </td>
                      </ng-container>


                      <tr class="trans-row" mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >

                      </tr>
                      <tr style="font-size: smaller;" mat-row class="trans-element-row" *matRowDef="let row; columns: dataTableKey;"
                      >

                      </tr>
                      <!-- Row shown when there is no matching data. -->
                      <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
                      </tr>

                    </table>
                    <div style="visibility: hidden; position: fixed"
                      [style.left]="contextMenuPosition.x"
                      [style.top]="contextMenuPosition.y"
                      [matMenuTriggerFor]="contextMenu">
                    </div>

                    <mat-menu #contextMenu="matMenu" #contextMenu2="matMenu">
                      <ng-template matMenuContent let-item="item">
                        <button mat-menu-item (click)="onContextMenuNew(item)"> {{currentTransType}} Transactions in New Tab </button>
                        <button mat-menu-item (click)="onContextMenuSame(item)"> {{currentTransType}} Transactions in Same Window</button>
                      </ng-template>
                    </mat-menu>


                    <div *ngIf="canRenderDetails && dataSource.data.length === 0">No batches found for {{f.transType.value}}, {{f.mode.value}}
                    </div>

                  </div>


              </div>

            </tr>
    </table>

    <mat-paginator
    [length]="100"
    [pageSize]="10"
    showFirstLastButtons >
    </mat-paginator>
  </div>

</form>
