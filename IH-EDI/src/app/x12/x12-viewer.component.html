<div class="x12-viewer">
    <div class="x12-header">
    <div style="display:flex;gap:8px;align-items:center;flex:1 1 auto;min-width:0;">
      <span class="view-toggle">
        <button mat-button (click)="viewMode='raw'" [class.active]="viewMode==='raw'">Raw</button>
        <button mat-button (click)="viewMode='tree'" [class.active]="viewMode==='tree'">Tree</button>
      </span>
      <strong style="flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        {{ messageHeading }}</strong>
    </div>
    <div style="display:flex;gap:8px;align-items:center;" *ngIf="showControls">
      <select class="tx-select" [value]="selectedTx" (change)="selectedTx = $event.target.value">
        <option *ngFor="let t of transactions" [value]="t.code">{{t.code}} - {{t.label}}</option>
      </select>
      <button mat-button class="display-btn" (click)="displaySelectedTransaction()">Display</button>
    </div>
  </div>

  <div *ngIf="!collapsed" class="x12-body">
    <ng-container *ngIf="viewMode === 'raw'">
      <pre class="x12-pre">{{ formatted }}</pre>
    </ng-container>

    <ng-container *ngIf="viewMode === 'tree'">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <div class="element-node">
          <span class="node-tag">{{ node.name }}{{ node.label ? ' - ' + node.label : '' }}</span>
          <span class="node-value" *ngIf="node.value">{{node.value}}</span>
        </div>
      </mat-tree-node>

      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
        <div class="mat-tree-node">
          <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name">
            <mat-icon>
              {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>
          </button>
          <span class="node-tag">{{ node.name }}{{ node.label ? ': ' + node.label : '' }}</span>
          <span class="node-value" *ngIf="node.value">{{node.value}}</span>
        </div>
        <ul [class.example-tree-invisible]="!treeControl.isExpanded(node)">
          <ng-container *ngIf="node.children && node.children.length && isLeafArray(node); else nested">
            <table class="element-table">
              <tbody>
                <tr *ngFor="let row of chunkChildren(node,5)">
                  <td *ngFor="let child of row" class="element-cell">
                    <div class="element-node">
                      <div class="node-kv">
                        <span *ngIf="child.value && child.value.toString().trim().length > 0">{{ child.name }}: {{ child.value }}</span>
                        <span *ngIf="!(child.value && child.value.toString().trim().length > 0)" class="element-empty">—</span>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </ng-container>
          <ng-template #nested>
            <ng-container matTreeNodeOutlet></ng-container>
          </ng-template>
        </ul>
      </mat-nested-tree-node>
      </mat-tree>
    </ng-container>
  </div>
</div>
