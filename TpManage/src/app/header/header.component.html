<html>
  <head>

    <title>TP Login</title>
  </head>

  <body style="padding: 1px;">
  <nav class="navbar navbar-default">
    <table>
      <tr >
        <td>

          <div >
            <ng-template [ngIf]="isLogin" [ngIfElse]="loggedOut">
            <button class="button button-stable button-clear" on-click="onHome()"
               style="border-width: 0ch; border-spacing: 0pc; padding: 0pc;" >
              <img width="100%" src="../../assets/ih-sh.jpg" >
              </button>
            </ng-template>
              <ng-template #loggedOut>
                <img [border]="1" width="200" alt="My image name" src="../../assets/ih-sh.jpg">
              </ng-template>
          </div>

        </td>
        <td style="border: 2pt; margin-right: 5pt;">
          <div *ngIf=isLogin>
          <mat-list-item (click)="onContextSettings()">
            <mat-icon matListItemIcon style="cursor: pointer;">settings</mat-icon>
            <br>
            <mat-label style="cursor:pointer">Settings</mat-label>
          </mat-list-item>
          </div>



      </td>
        <div *ngIf=!isLogin> Trading Partner Management</div>

        <ng-container *ngFor="let lnk of links">

        <td>
          <div *ngIf=isLogin>
          <button style="width: 160pt;"
          (click)="routeLnk(lnk.link)" >
          {{lnk.name}}
          </button>
          </div>

        </td>

        </ng-container>




          <td>
            <mat-label *ngIf=isLogin disabled> {{currentUser.username}} @ {{currentUser.environment}} </mat-label>

          <div *ngIf=isLogin style="align-items:start;">
                <button style="background-color: red; font-size: small; width: 80pt;" (click)="logout()">Logout</button>
          </div>
          </td>
      </tr>
    </table>
  </nav>

  <div class="col-md-6 offset-md-3 mt-5" *ngIf=!isLogin>
    <div class="alert alert-info">
      {{displayHelp}}
    </div>
    <div class="card">
        <h4 class="card-header">Login</h4>
        <div class="card-body">
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" formControlName="username" class="form-control" />
                     <div *ngIf="loginForm.get('username')?.errors?.['required']" style="color: red; font-size: small; font-style: italic;">Username is required</div>

                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" formControlName="password" class="form-control"
                    [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                    <div *ngIf="loginForm.get('password')?.errors?.['required']" style="color: red; font-size: small; font-style: italic;">Password is required</div>
                </div>
                <div class="form-group" style="color: beige; align-items: center;">
                  <table style="font-size: 5px;
                  border-color: black; border-style: dashed;border-width: thin; background-color: unset; align-items: center;">
                  <tr style="align-items: center;">
                    <td style="align-items: center;">

                <mat-form-field style="background-color: unset;">
                  <mat-label>Environment</mat-label>
                  <mat-select formControlName="env" class="form-control">
                    <mat-option value="DEV">DEV</mat-option>
                    <mat-option value="QA">QA</mat-option>
                    <mat-option value="UAT">UAT</mat-option>
                    <mat-option value="PROD">PROD</mat-option>
                  </mat-select>
                </mat-form-field>

              </td>
              <td style="align-items: center;">

                <mat-form-field>
                  <mat-label>Auto Logout (in min)</mat-label>
                  <mat-select formControlName="logoutTime" class="form-control">
                    <mat-option value="15">15</mat-option>
                    <mat-option value="30">30</mat-option>
                    <mat-option value="60">60</mat-option>
                    <mat-option value="120">120</mat-option>
                  </mat-select>
                </mat-form-field>

              </td></tr></table>
              </div>
                <button [disabled]="loginForm.invalid" class="btn btn-primary" >
                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                    Login
                </button>
                <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
            </form>
        </div>
    </div>
  </div>
</body>
</html>
