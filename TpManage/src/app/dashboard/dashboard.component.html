
<form [formGroup]="form"  class="form-group" >

  <div *ngIf="canRenderDetails" style="width: 100%; height: 500px; background:rgb(192, 206, 231) ">

    <canvas baseChart style="width: 100%;"
    [datasets]="barChartData"
    [labels]="mbarChartLabels"
    [options]="barChartOptions"
    [legend]="barChartLegend"
    [type]="barChartType"
    (chartHover)="chartHovered($event)"
    (chartClick)="chartClicked($event)">
  </canvas>
  </div>
  <div>



             <table style="font-size: small; background-color: azure; border-color: blue;"
             mat-table [dataSource]="dataSource" multiTemplateDataRows matSort *ngIf="dataSource.data.length > 0"

                    style="font-size: small; background-color: azure;">

                      <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                        <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header> {{dataTableLabel[i]}} </th>
                        <td mat-cell *matCellDef="let element" (contextmenu)="onContextMenu($event, element, i)"  > {{element[column]}} </td>
                      </ng-container>


                      <tr class="trans-row" mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >

                      </tr>
                      <tr style="font-size: smaller;" mat-row class="trans-element-row" *matRowDef="let row; columns: dataTableKey;"
                      >

                      </tr>

                      <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
                      </tr>

                    </table>
                    <div style="visibility: hidden; position: fixed"
                      [style.left]="contextMenuPosition.x"
                      [style.top]="contextMenuPosition.y"
                      [matMenuTriggerFor]="contextMenu">
                    </div>

                    <mat-menu #contextMenu="matMenu" #contextMenu2="matMenu">
                      <ng-template matMenuContent let-item="item">
                        <button mat-menu-item (click)="onContextMenuNew(item)"> {{currentTransType}} Transactions in New Tab </button>
                        <button mat-menu-item (click)="onContextMenuSame(item)"> {{currentTransType}} Transactions in Same Window</button>
                      </ng-template>
                    </mat-menu>


                    <div *ngIf="canRenderDetails && dataSource.data.length === 0">No records found for {{f.transType.value}} - {{f.mode.value}}
                    </div>

                  </div>




</form>
