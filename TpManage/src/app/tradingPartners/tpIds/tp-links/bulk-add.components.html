<html>
  <head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">

    <title>TP Link Form</title>
  </head>
  <body style="padding: 50px;">
  <h1>Add TP Links - {{parentTpId}}</h1>

  <div *ngIf="canRender">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-group" >
    <div class="form-row">

        <div class="form-group col-9">
            <label>TP Link Name Tag</label>
            <input type="text" formControlName="Link" class="form-control"
              />
            <div *ngIf="submitted && f.Link.errors" class="invalid-feedback">
                <div *ngIf="f.Link.errors.required">Link is required</div>
            </div>
        </div>

      </div>



    <div class="form-row">

      <div class="form-group col-5">
        <label>Provider ID: {{parentTpId}}</label>
       </div>

      <div class="form-group col-6" >
        <label>Payer Id</label>
        <select id="PayerId" formControlName="PayerId"
         class="rounded-inputs20 select-select col-md-7">
          <option *ngFor="let tpId of ownerTpIds" [value]="tpId">{{tpId}}</option>
        </select>
        <div *ngIf="submitted && f.PayerId.errors" class="invalid-feedback">
            <div *ngIf="f.PayerId.errors.required">ISA SenderId is required</div>
        </div>
     </div>


    </div>

    <div class="form-row">

      <div class="form-group col-3">
        <label>Separators</label>
        <input type="text" formControlName="Separators" class="form-control" value="|*^:" defaultValue="|*^:" />
    </div>
    </div>

    <table border="1">
     <tr>
        <th>Option</th>
        <th>Real Time</th>
        <th>Batch</th>
      </tr>
      <tr>
        <td><label>Type</label></td>
      <td>


        <mat-form-field appearance="fill">
          <mat-label>Transactions</mat-label>
          <mat-select formControlName="RtTransType" [multiple]="true">
            <mat-option *ngFor="let tt of RtTransactionTypes" [value]="tt">{{tt}}</mat-option>
          </mat-select>
        </mat-form-field>

        <div *ngIf="submitted && f.RtTransType.errors" class="invalid-feedback">
          <div *ngIf="f.RtTransType.errors.required">RT TransType is required</div>
        </div>


    </td>

    <td>

    <mat-form-field appearance="fill">
      <mat-label>Transactions</mat-label>
      <mat-select formControlName="BatchTransType" [multiple]="true">
        <mat-option *ngFor="let tt of BatchTransactionTypes"  [value]="tt">{{tt}}</mat-option>
      </mat-select>
    </mat-form-field>

    <div *ngIf="submitted && f.BatchTransType.errors" class="invalid-feedback">
      <div *ngIf="f.BatchTransType.errors.required">Batch TransType is required</div>
    </div>

</td>
</tr>

<tr>
  <td><label>Ack</label></td>
  <td>
      <select formControlName="RtAck" class="form-control">
        <option *ngFor="let ack of RTackTypes" >{{ack}}</option>
      </select>
      <div *ngIf="submitted && f.RtAck.errors" class="invalid-feedback">
          <div *ngIf="f.RtAck.errors.required">Ack is required</div>
      </div>

 </td>
 <td>


    <select formControlName="BatchAck" class="form-control">
      <option *ngFor="let ack of BatchackTypes" >{{ack}}</option>
    </select>
    <div *ngIf="submitted && f.BatchAck.errors" class="invalid-feedback">
        <div *ngIf="f.BatchAck.errors.required">Ack is required</div>
    </div>

 </td>
</tr>
<tr>
  <td><label>Routing</label></td>
  <td>
    <div class="form-group col-5">
      <label >RT</label>
     </div>
   </td>

  <td>



    <select formControlName="BatchRouting" class="form-control"
    >
      <option *ngFor="let route of routingTypes" >{{route}}</option>
  </select>
  <div *ngIf="submitted && f.BatchRouting.errors" class="invalid-feedback">
      <div *ngIf="f.BatchRouting.errors.required">Routing is required</div>
  </div>

</td>


</tr>
<tr>
  <td><label>SNIP</label></td>
  <td>
    <select formControlName="RtSNIP" class="form-control"
    >
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="0">0</option>
    </select>
    <div *ngIf="submitted && f.RtSNIP.errors" class="invalid-feedback">
        <div *ngIf="f.RtSNIP.errors.required">SNIP is required</div>
    </div>
</td>


<td>


        <select formControlName="BatchSNIP" class="form-control"
        >
            <option value="2">2</option>
            <option value="1">1</option>
            <option value="0">0</option>
        </select>
        <div *ngIf="submitted && f.BatchSNIP.errors" class="invalid-feedback">
            <div *ngIf="f.BatchSNIP.errors.required">SNIP is required</div>
        </div>
      </td>


    </tr>
</table>
<!-- Save and Cancel -->
<BR/>
<div class="form-row">
      <div class="form-group col-7">
        <button [disabled]="loading" class="btn btn-primary">
            <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
            Create
        </button>
        <a (click)="onCancel()" class="btn btn-link">Cancel</a>
      </div>
</div>


  </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
</body>
</html>
