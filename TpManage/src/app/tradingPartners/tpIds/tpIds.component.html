<div>
    <h1 style="color: brown; align-content: center;">TPIDs for {{ tpId }}</h1>

  <button (click)="addRow()">
    Add TPID
  </button>
</div>

<table mat-table [dataSource]="dataSource" multiTemplateDataRows>
  <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
    <th mat-header-cell *matHeaderCellDef>
      {{ col.label }}
    </th>
    <td mat-cell *matCellDef="let element">
      <div [ngSwitch]="col.type" *ngIf="!element.isEdit">
        <ng-container *ngSwitchCase="'isSelected'">

        </ng-container>

        <TD>
          <div class="btn-edit" *ngSwitchCase="'isEdit'">
          <button mat-button (click)="element.isEdit = !element.isEdit">
            <mat-icon>edit</mat-icon>

          </button>
          <button  mat-button (click)="removeRow(element);"  >
            <mat-icon>delete</mat-icon>

          </button>
        </div>
        </TD>
        <TD>
        <div class="btn-edit" *ngSwitchCase="'isEdit'">
          <button mat-button [routerLink]="['../tp-links', element.TPID]">
            <mat-icon>list</mat-icon>
          TP Links
          </button>
        </div>
      </TD>

        <span *ngSwitchDefault>
          {{ element[col.key] }}
        </span>
      </div>
      <div [ngSwitch]="col.type" *ngIf="element.isEdit">
        <div *ngSwitchCase="'isSelected'"></div>
        <div class="btn-edit" *ngSwitchCase="'isEdit'">
          <button
            mat-button
            (click)="editRow(element)"
            [disabled]="disableSubmit(element.id)"
          >
            Save
          </button>
          <button
            mat-button
            (click)="cancelRow(element)"
            [disabled]="disableSubmit(element.id)"
          >
            Cancel
          </button>
        </div>

        <mat-form-field class="form-input" *ngSwitchDefault>
          <input
            matInput
            [required]="col.required"
            [pattern]="col.pattern"
            [type]="col.type"
            [(ngModel)]="element[col.key]"
            (change)="inputHandler($event, element.id, col.key)"
          />
        </mat-form-field>
      </div>
    </td>


  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
  <tr mat-row *matRowDef="let element; columns: displayedColumns;" class="tpId-element-row"
    [class.tpId-expanded-row]="element.isExpanded"></tr>


</table>

<mat-paginator #paginator
[length]="100"
[pageSize]="5"
[pageSizeOptions]="[5, 10, 20]"
showFirstLastButtons>
</mat-paginator>
