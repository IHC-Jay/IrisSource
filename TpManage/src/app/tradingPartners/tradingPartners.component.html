<article class="table-header">

    <table>
      <tr>
        <td>
  <h4>Search for trading partner</h4>
  <mat-form-field class="full-width">
    <input matInput (keyup)="applyFilter($event)" placeholder="TP name" #input>
</mat-form-field>
</td> <td>
    <button  (click)="addRow()">
      Add TP
    </button>
  </td>

  </tr>
  </table>

</article>

<hr>
<table mat-table [dataSource]="dataSource" matSort>
  <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ col.label }}
    </th>
    <td mat-cell *matCellDef="let element">
      <div [ngSwitch]="col.type" *ngIf="!element.isEdit">
        <ng-container *ngSwitchCase="'isSelected'">

        </ng-container>
    <td>
        <div class="btn-edit" *ngSwitchCase="'isEdit'">
          <button
            (click)="element.isEdit = !element.isEdit">
            <mat-icon>edit</mat-icon>
          </button>
          </div>
    </td><td>
          <div class="btn-delete" *ngSwitchCase="'isEdit'">
          <button  (click)="removeRow(element);" >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
<td>
        <div class="btn-edit" *ngSwitchCase="'isEdit'">
         <button [routerLink]="['tpIds', element.Name]">
          <mat-icon>list</mat-icon>
          TPIDs
         </button>
        </div>
      </td>
        <span *ngSwitchDefault>
          {{ element[col.key] }}
        </span>
      </div>
      <div [ngSwitch]="col.type" *ngIf="element.isEdit">
        <div *ngSwitchCase="'isSelected'"></div>
        <div class="btn-edit" *ngSwitchCase="'isEdit'">
          <button
            mat-button
            (click)="editRow(element)"
            [disabled]="disableSubmit(element.id)"
          >
            Save
          </button>
          <button
          mat-button
          (click)="cancelRow(element)"
          [disabled]="disableSubmit(element.id)"
        >
          Cancel
        </button>
        </div>

        <mat-form-field class="form-input" *ngSwitchDefault>
          <input
            matInput
            [required]="col.required"
            [pattern]="col.pattern"
            [type]="col.type"
            [(ngModel)]="element[col.key]"
            (change)="inputHandler($event, element.id, col.key)"
          />
        </mat-form-field>
      </div>
    </td>


  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<mat-paginator #paginator
[length]="100"
[pageSize]="10"
[pageSizeOptions]="[10, 20, 30]"
showFirstLastButtons>
</mat-paginator>
