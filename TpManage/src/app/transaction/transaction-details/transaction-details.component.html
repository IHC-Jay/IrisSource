<div class="card" style="width: 24rem;">
  <!-- <img src="..." class="card-img-top" alt="..."> -->
  <div class="card-body">
      <h5 class="card-title">{{transaction}}: {{dataSource.data[0]?.InterchangeSenderID}} -> {{dataSource.data[0]?.InterchangeReceiverID}}</h5>
      <p class="card-text">Batch # {{dataSource.data[0]?.BHTRefId}}</p>
  </div>
</div>

<button class="btn btn-primary" (click)="toTransactions()">
  Back to Transactions
</button>

  <div class="flex-container">
    <div class="mt-2" *ngFor="let item of displayedColumns; let itemIndex = index ">

      <label for="staticEmail" class="col-form-label form-label" *ngIf="item.label !== 'X12 Data'">{{item.label}}</label>
      <div class="padding" >
        <span class="custom-text-truncate" *ngIf="item.label !== 'X12 Data'" >{{getSelectedValue(item.key)}}</span>
      </div>
    </div>
</div>
<div class="center" *ngIf="X12DataParentId !== ''">
  <button mat-flat-button (click)="openX12Modal()" mat-raised-button color="primary">Display Full X12</button>
</div>
<div>
    <div *ngFor="let item of displayedColumns; let itemIndex = index ">
      <div class="padding" *ngIf="item.label === 'X12 Data'">
      <label class="col-form-label form-label" *ngIf="X12DataParentId !== ''; else elseBlock">X12 Segment:</label>
      <ng-template #elseBlock>
        <B>Full X12:</B>
      </ng-template>
      <BR>
        <span class="custom-text-truncate">{{getSelectedValue(item.key)}}</span>
      </div>
    </div>
  </div>
