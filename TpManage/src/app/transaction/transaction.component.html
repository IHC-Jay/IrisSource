
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: white;">
    <as-split direction="vertical">
      <as-split-area [size]="40" minSize="10" maxSize="60">

      <table>
        <tr>

        <td>
    <mat-form-field appearance="fill" style="margin-right: 10px;" >
      <mat-label>Transaction type</mat-label>
      <mat-select formControlName="transType" (selectionChange)="transactionChange($event.value)"
      [multiple]="false" >
        <mat-option *ngFor="let transType of TransactionTypes" [value]="transType">
          {{transType}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div *ngIf="submitted && f.transType.errors" class="invalid-feedback">
      <div *ngIf="f.transType.errors.required">TransType is required</div>
    </div>


    <button  class="btn btn-primary" (click)="onSearchTransactions()">
      Search Transactions
    </button>
  </td>
        </tr>

      <tr>

    <!-- Search Static -->
    <div class="form-row" *ngIf="f.transType.value === '837P'">
<table>
  <tr> <td  class="form-group col-2" >

            <label  style="font-size: x-small;">Sender Trading Partner</label>
            <input  style="font-size: x-small;" type="text" formControlName="InterchangeSenderID" class="form-control" />

      </td> <td  class="form-group col-2" >

          <label  style="font-size: x-small;">Patient Control Number</label>
          <input  style="font-size: x-small;" type="text" formControlName="loop23001CLMClaimSubmittersIdentifier" class="form-control" />

    </td> <td  class="form-group col-2" >

        <label  style="font-size: x-small;">Billing Provide Tax ID</label>
        <input  style="font-size: x-small;" type="text" formControlName="loop2010AAREF1RefId" class="form-control" />

      </td>

        <td class="form-group col-2">

          <label  style="font-size: x-small;">Subscriber ID</label>
          <input  style="font-size: x-small;" type="text" formControlName="loop2010BANM11ILIdentificationCode" class="form-control" />

      </td> <td class="form-group col-2">

          <label  style="font-size: x-small;">Service Begin Date</label>
          <input  style="font-size: x-small;" type="text" formControlName="loop24001DTP1DateTimePeriod" class="form-control" />

      </td> <td class="form-group col-2">

          <label  style="font-size: x-small;">File Name</label>
          <input  style="font-size: x-small;" type="text" formControlName="FileName" class="form-control" />

      </td>
      </tr>
      </table>
     </div>

    </tr>
    <tr>
    <!-- Search -->
    <table>
      <tr>
        <td class="form-group col-2">
          <label><b>Additional Search Conditions: </b></label>
        </td>
          <td class="form-group col-2">
          <select formControlName="searchField"  class="rounded-inputs20 select-select col-md-12" style="font-size:small;" >
        <option *ngFor="let fld of searchColumns" [value]="fld.label">{{fld.label}}</option>
      </select>
      </td>
      <td class="form-group col-2">
      <select formControlName="searchCndition"  class="rounded-inputs20 select-select col-md-8" >
        <option *ngFor="let con of conditionColumns" [value]="con">{{con}} </option>
      </select>
      </td>
      <td class="form-group col-4">
      <input type="text" formControlName="searchValue" class="rounded-inputs20 select-select col-md-16" [(ngModel)]="searchValue" />
      <div *ngIf="submitted && f.searchValue.errors" class="invalid-feedback">
        <div *ngIf="f.searchValue.errors.required">Value is required</div>
    </div>
      </td>


      <td class="form-group col-1">
        <button class="icon" [disabled]="loading" class="btn btn-primary" (click)="addRow()">
          <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
          Add
        </button>

      </td>
      <td class="form-group col-1">
      <button  *ngIf="searchTransaction" class="btn btn-primary" (click)="clearSearch()">
        Clear
      </button>
      </td>
      </tr>
  </table>
  </tr>

 <tr>
  <!-- Information on search -->
  <label  *ngIf="searchTransaction" style="font-size: medium;" ><b>Search Creteria: </b> </label>
  <label  *ngIf="searchTransaction" style="font-size: small;" >{{searchString}}</label>


  </tr>
  <tr>
        <!-- Columns to be displayed  & save -->
        <table>
          <tr>
            <td>

              <label><b>{{displayLabel}} </b></label>
              </td>

              <td>
                <div class="selDiv">

                  <ng-multiselect-dropdown class="container"
                  [placeholder]="'Select Columns to display'"
                  [settings]="dropdownSettings"
                  [data]="allDropdownList"
                  [(ngModel)]="selDropdownList"
                  (onSelect)="onItemSelect($event)"
                  (onDeSelect)="onItemDeSelect($event)"
                  [ngModelOptions]="{standalone: true}"
                  >
                </ng-multiselect-dropdown>

              </div>
              </td>

            <td>
              <button *ngIf="butSaveDisplay" mat-stroked-button color="primary" (click)="saveDisplayColumns()"

              matTooltip="Save the display list">
              Save
              </button>
              </td>
            </tr>
        </table>
   </tr>
   </table>

  </as-split-area>
  <as-split-area [size]="60">

        <div>


            <!-- Transactions -->
            <div style="width:100%;overflow-x:scroll; height: 100%;">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows matSort >

                <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                  <th class="mat-header-cell" *matHeaderCellDef mat-sort-header> {{dataTableLabel[i]}} </th>
                  <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                </ng-container>


                <tr mat-header-row *matHeaderRowDef="dataTableKey;sticky: true">

                </tr>
                <tr mat-row class="trans-element-row" *matRowDef="let row; columns: dataTableKey;" (click)="onRowClicked(row)">

                </tr>

              </table>
            </div>

              <mat-paginator
              [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[10, 20, 30]"
              showFirstLastButtons >
              </mat-paginator>
        </div>



      </as-split-area>
    </as-split>
  </div>

  </form>
