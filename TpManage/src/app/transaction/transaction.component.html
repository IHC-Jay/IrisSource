
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: white; align-content: center;">
    <as-split direction="vertical">
      <as-split-area [size]="40" minSize="10" maxSize="60">

      <table style="font-size: 5px; border-color: blue; border-style: groove;border-width: thin; align-items: center;">
        <tr style="font-size: 10px; vertical-align:top" >
          <table>
            <tr>



          <!-- Date Time -->

          <td class="form-group col-2" style="font-size: 10px; ">
            <label>Process Start Date & Time</label>
            <div  style="border-color: black;border-style: dashed; border-width: thin;">

        <mat-form-field >

          <input matInput  name="startDate" type="date" style="font-size: 10px;"
          value="{{startDate}}"
          placeholder="mm-dd-yyyy" required (change)="onStDateChange($event)"/>

      </mat-form-field>
      <mat-form-field >

        <input type="time" style="font-size: 10px;" matInput name="startTm"
       value="{{startTm}}" (change)="onStTimeChange($event)"
        />

    </mat-form-field>
    </div>
        </td>

        <td class="form-group col-2" style="font-size: 10px;  ">
          <label>Process End Date & Time</label>
          <div style="border-color: black;border-style: dashed; border-width: thin; ">


          <mat-form-field >

            <input type="date" style="font-size: 10px;" matInput name="endDate"
             value="{{endDate}}" (change)="onEndDateChange($event)"/>

        </mat-form-field>
        <mat-form-field >

          <input type="time" style="font-size: 10px; " matInput name="endTm"
         value="{{endTm}}" (change)="onEndTimeChange($event)"/>

        </mat-form-field>
    </div>
          </td>

          <td class="form-group col-1" >
            <label style="font-size: 10px;text-align: left ;">Mode</label>
            <div style="font-size: 5px; border-color: blue; border-style: dashed; border-width: thin;">

            <mat-radio-group  formControlName="mode" >
              <mat-radio-button  style="font-size: 10px;" value="RealTime">RealTime</mat-radio-button>
              <mat-radio-button  style="font-size: 10px;" value="Batch">Batch</mat-radio-button>
            </mat-radio-group>
            </div>

          </td>

          <td class="form-group col-2" style="font-size: 10px; " >
            <table>
              <tr>
                <td>


            <label style="font-size: 10px; text-align: left ;">Transaction type</label>
          </td>
        </tr>
        <tr>
          <td>

            <mat-form-field appearance="fill" style="margin-left: 10px;" >

              <mat-select formControlName="transType" (selectionChange)="transactionChange($event.value)"
              [multiple]="false" >
                <mat-option *ngFor="let transType of transactionTypes" [value]="transType" style="font-size: 10px;">
                  {{transType}}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <div *ngIf="submitted && f.transType.errors" class="invalid-feedback">
              <div *ngIf="f.transType.errors.required">TransType is required</div>
            </div>
          </td>
        </tr>
      </table>
            </td>
          <td class="form-group col-2" style="font-size: 10px;" >
            <table>
              <tr>
                <td>

            <label style="font-size: 10px; text-align: left ;">Disposition</label>
          </td>
        </tr>
        <tr>
          <td>
            <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

              <mat-select formControlName="disposition"
              [multiple]="false" >
                <mat-option *ngFor="let rowCnt of dispositions" [value]="rowCnt" style="font-size: 10px;">
                  {{rowCnt}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </td>
        </tr>
      </table>
          </td>

          <td class="form-group col-2" style="font-size: 10px;" >
            <table>
              <tr>
                <td>
            <label style="font-size: 10px; text-align: left ;">Display Count</label>
          </td>
        </tr>
        <tr>
          <td>
            <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

              <mat-select formControlName="rowCnt"
              [multiple]="false" >
                <mat-option *ngFor="let rowCnt of maxCount" [value]="rowCnt" style="font-size: 10px;">
                  {{rowCnt}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </td>
        </tr>
      </table>
          </td>

             <td>
              <table>
                <tr>
                  <td>
              <label style="font-size: 10px; text-align: left ;">Action</label>
            </td>
          </tr>
          <tr>
            <td>

            <button  class="btn btn-primary" style="background-color: navy;" (click)="onSearchTransactions(); ">
              Search Transactions
            </button>
            </td>
            </tr>


      </table>
          </td>

      </tr>
    </table>

        </tr>


        <tr>
          <hr>
        <!-- Custom Fields -->
         <table>
          <div formArrayName="additional">
            <tr>
              <td *ngFor="let newFld of form.get('additional')['controls']; let i = index" [formGroupName]="i">
                <label class="searchLbl"> {{newFld.get('fld').value}}</label>

                <input style="font-size: x-small; padding-right: 40pt; margin-right: 10pt;" type="text" matInput formControlName="newFldValue" placeholder="Value for {{newFld.get('fld').value}}">

              </td>
            </tr>
        </div>
         </table>
        </tr>


    <tr>
<hr>
    <!-- Additional Search -->
    <table style="width: 100%;">
    <tr align="left">

        <td class="form-group col-2" style="font-size: small; " align="right; width:10%">
          <label style="font-size: 11px;  ">Additional Search Conditions (Field, Condition, Value): </label>
        </td>
          <td class="form-group col-2" style="font-size: small; width: 30%;">
          <select formControlName="searchField"  class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif;" >
        <option *ngFor="let fld of searchColumns" [value]="fld.label">{{fld.label}}</option>
      </select>
      </td>
      <td class="form-group col-2" class="form-group col-2" style="font-size: small; width: 10%;">
      <select formControlName="searchCndition"  class="rounded-inputs20 select-select col-md-12" style="font-size:small; font-family: Calibri, Calibri, serif;">
        <option *ngFor="let con of conditionColumns" [value]="con">{{con}} </option>
      </select>
      </td>
      <td class="form-group col-4" style="font-size: small; width:20%; ">
      <input type="text" formControlName="searchValue" required="true"
      style="font-size:small; font-family: Calibri, serif; "
       [(ngModel)]="searchValue" />
       <div *ngIf="submitted && f.searchValue.errors" class="invalid-feedback">
        <div *ngIf="f.searchValue.errors.required">Value is required</div>
      </div>

  </td>
  <td class="form-group col-4" class="form-group col-2" style="font-size: small; width: 5%; ">
      <button *ngIf="searchValue" class="icon" style="background-color: navy; font-family: Calibri, serif;"
         [disabled]="loading" class="btn btn-primary" (click)="addRow()">
          <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
          Add
        </button>

      </td>
      <td class="form-group col-1" style="font-size: small; width: 5%;">
      <button  *ngIf="searchTransaction" class="btn btn-primary" style="background-color: navy; font-family: Calibri, Calibri, serif;"  (click)="clearSearch()">
        Clear
      </button>
      </td>
    </tr>
    </table>

  </tr>

 <tr>

    <!-- Search -->
    <table style="width: 100%;">
    <tr>
  <!-- Information on search -->
      <td  style="font-size: small; text-align: left; width: 5%;">
  <label  *ngIf="searchTransaction" style="font-size: 11px;text-align: left ;" ><b>Search Creteria: </b> </label>
  </td>

    <td class="form-group col-2" style="font-size: small; text-align: left;">
  <label  *ngIf="searchTransaction" style="font-size: 11px;text-align: left ;" >{{additionalsearchString}}</label>
  </td>
 </tr>
 </table>

  </tr>

  <tr>
        <!-- Columns to be displayed  & save -->
        <table style="width: 100%;">
          <tr>
            <td>

              <label style="font-size: 11px;text-align: left ;" >{{displayLabel}} </label>
              </td>

              <td style="font-size: small; width: 80%;">
                <div class="selDiv" style="width: 100%;">

                  <ng-multiselect-dropdown class="container"
                  [placeholder]="'Select Columns to display'"
                  [settings]="dropdownSettings"
                  [data]="allDropdownList"
                  [(ngModel)]="selDropdownList"
                  (onSelect)="onItemSelect($event)"
                  (onDeSelect)="onItemDeSelect($event)"
                  [ngModelOptions]="{standalone: true}"
                  >
                </ng-multiselect-dropdown>

              </div>
              </td>
              </tr>
              </table>

   </tr>
   </table>

  </as-split-area>
  <as-split-area [size]="60">

        <div>


            <!-- Transactions -->
            <div style="width:100%;overflow-x:scroll; height: 100%; font-size: small;">
            <table mat-table [dataSource]="dataSource" multiTemplateDataRows matSort *ngIf="dataSource.data.length > 0"
              style="font-size: small;">

                <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                  <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header> {{dataTableLabel[i]}} </th>
                  <td mat-cell *matCellDef="let element" (contextmenu)="onContextMenu($event, element, i)"  > {{element[column]}} </td>
                </ng-container>


                <tr class="trans-row" mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >

                </tr>
                <tr style="font-size: smaller;" mat-row class="trans-element-row" *matRowDef="let row; columns: dataTableKey;"
                >

                </tr>

              </table>
              <div style="visibility: hidden; position: fixed"
              [style.left]="contextMenuPosition.x"
              [style.top]="contextMenuPosition.y"
              [matMenuTriggerFor]="contextMenu">
            </div>
              <mat-menu #contextMenu="matMenu" #contextMenu2="matMenu">
                <ng-template matMenuContent let-item="item">
                  <button mat-menu-item (click)="onContextMenuNew(item)">Details in New Tab</button>
                  <button mat-menu-item (click)="onContextMenuSame(item)">Details in Same Window</button>
                </ng-template>
              </mat-menu>

              <div *ngIf="canRenderDetails && dataSource.data.length === 0">No records found for {{f.transType.value}} - {{f.mode.value}} </div>

            </div>

              <mat-paginator
              [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[10, 20, 30]"
              showFirstLastButtons >
              </mat-paginator>
        </div>



      </as-split-area>
    </as-split>
  </div>

  </form>
