
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: white; ">
    <table style="font-size: 5px; border-color: gray; border-style: groove;border-width: thin; background-color: azure;">
      <tr style="font-size: 10px; vertical-align:top" >
        <td class="form-group col-1" style="font-size: 10px; vertical-align:top;   width: 150px;">
          <label style="font-size: 10px;text-align: left ;">Transaction type</label>
        </td>
        <td *ngIf="showMode" class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 120px">
          <label style="font-size: 10px;text-align: left ;">Mode</label>
        </td>


        </tr>
        <tr>

          <td class="form-group col-1" style="font-size: 10px; vertical-align:top" >


            <mat-form-field appearance="fill" style="margin-left: 10px;" >

              <mat-select formControlName="transType" (selectionChange)="transactionChange($event.value)"
              [multiple]="false" >
                <mat-option *ngFor="let transType of transactionTypes" [value]="transType" style="font-size: 10px;">
                  {{transType}}
                </mat-option>
              </mat-select>
            </mat-form-field>


          </td>

          <td *ngIf="showMode"  class="form-group col-1" style="font-size: 10px; vertical-align:top; width: 120px"  >

            <div style="font-size: 5px; border-color: gray; border-style: dashed; border-width: thin; width: 120px ">

            <mat-radio-group formControlName="mode" (change)="transactionChange($event.value)" >
            <mat-radio-button  style="font-size: 10px;" value="Batch">Batch</mat-radio-button>
            <br>

            <mat-radio-button  style="font-size: 10px;" value="RealTime">RealTime</mat-radio-button>

           </mat-radio-group>
           </div>

           </td>





      </tr>
      </table>

      <table style="width: 100%;  background-color: azure;">
      <tr>
      <!-- Search -->
      <table style="width: 100%;  background-color: azure;">
        <tr>
          <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
            <label style="font-size: medium; text-align: left ;">Display Count</label>
          </td>
            <td class="form-group col-2" style="font-size: small; " align="right; width:10%">
              <label style="font-size: medium; text-align: left ;  ">Additional Search Fields for {{currentTransType}}:</label>
              </td>
              <td class="form-group col-2" style="font-size: small; " align="right; width:10%">
                <label style="font-size: medium; text-align: left ;  ">Display Fields for {{currentTransType}}: </label>
              </td>
              <td></td>
        </tr>
        <tr>
          <td class="form-group col-1" style="vertical-align: top;">

            <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

              <mat-select formControlName="rowCnt"
              [multiple]="false" >
                <mat-option *ngFor="let rowCnt of maxCount" [value]="rowCnt" style="font-size: 10px;">
                  {{rowCnt}}
                </mat-option>
              </mat-select>
            </mat-form-field>

          </td>
            <td class="form-group col-1" style="vertical-align: top; margin-right: 10pt;">
              <table style="width: 100%; border-style: dashed; border-color: gray; border-width: thin; background-color: azure;">

                  <tr  *ngFor="let val of searchCheckBoxValues; let i=index">
                  <td >
                          <span style="font-size: small; " class="checkbox">
                          <label>
                              <input style="font-size: small; margin-left: 2pt; margin-right: 1pt;" type="checkbox"
                              value="{{val.label}}" name="{{val.label}}" (click)="checkOrNotSearch($event)"[checked]="val.checked==='true'" />
                              {{val.label}}

                          </label>
                      </span>

                </td>
                </tr>
              </table>
          </td>


          <td class="form-group col-1" style="vertical-align: top;">

              <table style="width: 100%; border-style: dashed; border-color: gray; border-width: thin; background-color: azure;">


                  <tr  *ngFor="let val of displayCheckBoxValues; index as i">
                  <td >


                      <span style="font-size: small; " class="checkbox">
                          <label>
                              <input style="font-size: small; margin-left: 2pt; margin-right: 1pt;" type="checkbox"
                              value="{{val.label}}" name="{{val.label}}" (click)="checkOrNotDisplay($event)"
                              [checked]="val.checked==='true'"/>{{val.label}}

                          </label>

                      </span>
                    </td>

                    <td>

                      <mat-form-field class="form-group col-1" style="font-size: small; " class="example-full-width">
                        <mat-label style="font-size: small; ">Display Order #</mat-label>
                        <input type="number"
                        id="{{'OrdId'+i}}"
                        name="{{'OrdName'+i}}"
                        minlength="1" maxlength="2" size="3" min="1" max="25"
                        style="font-size: small; margin-left: 2pt;" matInput value={{val.order}}>
                      </mat-form-field>
                    </td>
                </tr>
              </table>
          </td>

          <td  class="form-group col-1" style="vertical-align:top;">
            <table style="width: 100%; background-color: azure; ">
              <tr style="align-items: center; align-content: center;vertical-align: middle;">
                <td style="align-items: center;align-content: center;vertical-align: middle;">
                <button class="icon" style="background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="saveSettings('Default')">

                    Save As Default
                  </button>
                </td>
                <tr><td><br></td></tr>
                <tr>
                <td>
                  <button class="icon" style="background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="saveSettings('Session')">

                    Save for the session
                  </button>
                </td>
                <td style="align-items: center;align-content: center;vertical-align: middle;">
                  <button class="icon" style="background-color: navy; font-family: Calibri, serif;"
                    class="btn btn-primary" (click)="resetSettings()">

                      Reset
                    </button>
                  </td>
              </tr>
              <tr><td><br></td></tr>
                <tr>
                <td>
                  <button class="icon" style="background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="toTransactions()">

                   Return
                  </button>
                </td>
              </tr>
            </table>

        </tr>
        </table>
        </tr>
        </table>



  </div>

  </form>
