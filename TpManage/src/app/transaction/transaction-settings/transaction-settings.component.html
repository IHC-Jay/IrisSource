
<form [formGroup]="form"  class="form-group" >

  <div style="width: 100%; height: 800px; background: white; ">

    <table style="width: 100%;  background-color: azure;">
      <tr style="vertical-align: top;">
        <td style="vertical-align: top;">
          <table style="font-size: 5px; border-color: gray; border-style: groove;border-width: thin; background-color: azure;">
            <tr style="font-size: 12px; vertical-align:top" >
              <td class="form-group col-1" style="font-size: 12px; vertical-align:top;   width: 150px;">
                <label style="font-size: 12px;text-align: left ;"><B>Default Configurations</B></label>
              </td>
            </tr>

            <tr>
              <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Start Tab</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfPage"
                  [multiple]="false" >
                    <mat-option *ngFor="let rowCnt of landingPage" [value]="rowCnt" style="font-size: 10px;">
                      {{rowCnt}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr>
              <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Transaction</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfTranType" (selectionChange)="cngfTranTypeChange($event.value)"
                  [multiple]="false" >
                    <mat-option *ngFor="let cfgTran of transactionTypes" [value]="cfgTran" style="font-size: 10px;">
                      {{cfgTran}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr *ngIf="showCngfMode">
              <td  class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Mode</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfMode"
                  [multiple]="false" >
                    <mat-option *ngFor="let cfgMode of modes" [value]="cfgMode" style="font-size: 10px;">
                      {{cfgMode}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr>
              <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Batches Search Timeframe</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfBthTime"
                  [multiple]="false" >
                    <mat-option *ngFor="let bthTm of searchTime" [value]="bthTm" style="font-size: 10px;">
                      {{bthTm}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr>
              <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Transactions Search Timeframe</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfTranTime"
                  [multiple]="false" >
                    <mat-option *ngFor="let tranTm of searchTime" [value]="tranTm" style="font-size: 10px;">
                      {{tranTm}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr>
              <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                <label style="font-size: 10pt; text-align: left ;">Workflow Search Timeframe</label>
              </td>
              <td class="form-group col-1" style="vertical-align: top;">

                <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                  <mat-select formControlName="cngfWfTime"
                  [multiple]="false" >
                    <mat-option *ngFor="let wfTm of searchTime" [value]="wfTm" style="font-size: 10px;">
                      {{wfTm}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

              </td>

            </tr>

            <tr>
                <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                  <label style="font-size: 10pt; text-align: left ;">Display Items per Page</label>
                </td>
                <td class="form-group col-1" style="vertical-align: top;">

                  <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                    <mat-select formControlName="cngfDispCnt"
                    [multiple]="false" >
                      <mat-option *ngFor="let rowCnt of maxCount" [value]="rowCnt" style="font-size: 10px;">
                        {{rowCnt}}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>

                </td>

              </tr>

              <tr>
                <td class="form-group col-1" style="font-size: 10px; vertical-align:top ; width: 10%;">
                  <label style="font-size: 10pt; text-align: left ;">Logout timeout (in mins)</label>
                </td>
                <td class="form-group col-1" style="vertical-align: top;">

                  <mat-form-field appearance="fill" style="font-size: 10px; width: fit-content;" >

                    <mat-select formControlName="cngfLogoff"
                    [multiple]="false" >
                      <mat-option *ngFor="let lTm of logoutTime" [value]="lTm" style="font-size: 10px;">
                        {{lTm}}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>

                </td>

              </tr>
              <tr style="align-items: center; align-content: center;vertical-align: middle;">
                <td style="align-items: center;align-content: center;vertical-align: middle;">
                <button class="icon" style="background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="saveConfig()">
                    Save Configuration
                  </button>
                </td>
                </tr>




          </table>
        </td>
<td>
    <table style="font-size: 5px; border-color: gray; border-style: groove;border-width: thin; background-color: azure;">
      <tr style="font-size: 12px; vertical-align:top" >
        <td *ngIf="showMode" class="form-group col-1" style="font-size: 12px; vertical-align:top ; width: 120px">
          <label style="font-size: 12px;text-align: left ;">Display / Search Mode</label>
        </td>

        <td class="form-group col-1" style="font-size: 12px; vertical-align:top;   width: 150px;">
          <label style="font-size: 12px;text-align: left ;">Transaction type</label>
        </td>

        <td></td>


        </tr>
        <tr>
          <td *ngIf="showMode"  class="form-group col-1" style="font-size: 10px; vertical-align:top; width: 120px"  >

            <div style="font-size: 5px; border-color: gray; border-style: dashed; border-width: thin; width: 120px ">

            <mat-radio-group *ngFor="let mode of modes" formControlName="dispMode" (change)="modeChange($event.value)" >
            <mat-radio-button  style="font-size: 10px;" [value]="mode" style="font-size: 10px;">
              {{mode}}
          </mat-radio-button>

           </mat-radio-group>
           </div>

           </td>

          <td class="form-group col-1" style="font-size: 10px; vertical-align:top" >


            <mat-form-field appearance="fill" style="width: 80pt;" >

              <mat-select formControlName="dispTransType" (selectionChange)="transactionChange($event.value)"
              [multiple]="false" >
                <mat-option *ngFor="let transType of transactionTypes" [value]="transType" style="font-size: 10px;">
                  {{transType}}
                </mat-option>
              </mat-select>
            </mat-form-field>


          </td>



           <td  class="form-group col-1" style="vertical-align:top; width:30%">
            <table style="width: 100%; background-color: azure; ">
              <tr style="align-items: center; align-content: center;vertical-align: middle;">
                <td style="align-items: center;align-content: center;vertical-align: middle;">
                <button class="icon" style=" height:50pt; background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="saveSettings('Default')">
                    Save As Default
                  </button>
                </td>

                <td>
                  <button class="icon" style="height:50pt; background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="saveSettings('Session')">
                    Save For Session
                  </button>
                </td>
                <td style="align-items: center;align-content: center;vertical-align: middle;">
                  <button class="icon" style="height:50pt; background-color: navy; font-family: Calibri, serif;"
                    class="btn btn-primary" (click)="resetSettings()">

                      Reset

                    </button>
                  </td>


                <td>
                  <button class="icon" style="height:50pt; background-color: navy; font-family: Calibri, serif;"
                  class="btn btn-primary" (click)="toTransactions()">

                   Return

                  </button>
                </td>
              </tr>
            </table>
          </td>


      </tr>
      <tr><td> <hr> </td> <td> <hr> </td><td> <hr> </td></tr>

      <!-- Titles / Buttons -->
     <tr>
      <td class="form-group col-2" style="font-size: small; " align="right; width:30%">
        <label style="font-size: 12px; text-align: left ;  ">Search Fields for  {{currentTransType}} {{modeString}} :</label>
        </td>
        <td class="form-group col-2" style="font-size: small; " align="right; width:40%">
          <label style="font-size: 12px; text-align: left ;  ">Display Fields for  {{currentTransType}} {{modeString}}: </label>
        </td>
        <td></td>
        </tr>


       <tr>


            <td class="form-group col-1" style="vertical-align: top; margin-right: 10pt;">
              <table style="width: 100%; border-style: dashed; border-color: gray; border-width: thin; background-color: azure;">

                  <tr  *ngFor="let val of searchCheckBoxValues; let i=index">
                  <td >
                          <span style="font-size: small; " class="checkbox">
                          <label>
                              <input style="font-size: small; margin-left: 2pt; margin-right: 1pt;" type="checkbox"
                              value="{{val.label}}" name="{{val.label}}" (click)="checkOrNotSearch($event)"[checked]="val.checked==='true'" />
                              {{val.label}}

                          </label>
                      </span>

                </td>
                </tr>
              </table>
          </td>


          <td class="form-group col-1" style="vertical-align: top;">

              <table style="width: 100%; border-style: dashed; border-color: gray; border-width: thin; background-color: azure;">
                <tr>
                    <td>
                    <mat-label style="font-size: small; text-align: right">Field Name</mat-label>
                    </td>
                    <td>
                    <mat-label style="font-size: small; text-align: right">Order #</mat-label>
                  </td>
                </tr>
                <tr  style="margin-top: 0pt; margin-top: 0pt;"  *ngFor="let val of displayCheckBoxValues; index as i">
                  <td>
                      <span style="font-size: small; " class="checkbox">
                          <label>
                              <input style="font-size: small; margin-left: 2pt; margin-right: 1pt;" type="checkbox"
                              value="{{val.label}}" name="{{val.label}}" (click)="checkOrNotDisplay($event)"
                              [checked]="val.checked==='true'"/>{{val.label}}

                          </label>
                      </span>
                    </td>

                    <td>

                      <mat-form-field class="form-group col-1" style="font-size: small; width: 60pt; height: 50pt; " class="example-full-width">
                        <input type="number"
                        id="{{'OrdId'+i}}"
                        name="{{'OrdName'+i}}"
                        minlength="1" maxlength="2" size="3" min="1" max="25"
                        style="font-size: small; margin-left: 2pt; text-align: right" matInput value={{val.order}}>
                      </mat-form-field>
                    </td>
                </tr>
              </table>
          </td>
          <td></td>



        </tr>
        </table>
        </td>
        </tr>


        </table>



  </div>

  </form>
