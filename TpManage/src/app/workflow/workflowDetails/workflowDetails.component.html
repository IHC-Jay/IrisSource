
<form [formGroup]="form"  class="form-group" >

  <div class="scr-container" style="width: 100%; height: 100%; background: white;">



        <table id="inpTab" style="width: 100%; background: azure; vertical-align: top; border-style: groove;border-width:
         thin; max-width: fit-content; ">


          <tr style="background: azure; vertical-align: top; ">
            <td style="width: 10%; ">
              <button style="font-size: 12px; margin-right: 10px;" class="btn btn-primary"
               (click)="toWorkFlow()">
                Back to Workflow
              </button>
            </td>
            <td style="width: 70%;">
              <textarea readonly="true" style="height: 50px; width: 100%; font-size: 10px;">{{errorStr}}</textarea>
            </td>

            <td class="form-group col-1">
              <mat-form-field style="font-size: 10px; " >
                <mat-label style="font-size: 10px; ">Status</mat-label>
                <mat-select formControlName="statusType" (selectionChange)="statusTypeChange($event.value)"
                style="font-size: 10px;">
                  <mat-option *ngFor="let statusType of statusTypes" [value]="statusType" style="font-size: 10px;">
                    {{statusType}}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <div *ngIf="submitted && f.statusType.errors" class="invalid-feedback">
                <div *ngIf="f.statusType.errors.required">Status Type is required</div>
              </div>

            </td>
            <td class="form-group col-2">
              <button style="font-size: 12px;" class="btn btn-primary"
              (click)="updateWF()">
                Update Status
              </button>
            </td>

          </tr>
        </table>



        <table style="border-style: groove;border-width: thin; width: 100%; font-size: small; background-color: azure;">
          <tr>
            <td *ngIf="canRenderDetails && this.errArray.length > 0"  style="vertical-align: top; width: 25%;">

              <!-- ERRORS -->
              <table *ngIf="canRenderDetails && this.errArray.length > 0" mat-table [dataSource]="errorDataSource"
              style="font-size: smaller; border-style: groove;border-width: thin; background-color: azure;">

                          <!-- Line # -->
                          <ng-container matColumnDef="Num">
                            <mat-header-cell style="font-size: smaller;font-weight: bold;" *matHeaderCellDef> # </mat-header-cell>
                            <mat-cell style="font-size: smaller;" *matCellDef="let element"> {{element.Num}} </mat-cell>
                          </ng-container>
                      <!-- Segment Column -->
                      <ng-container matColumnDef="Segment">
                        <mat-header-cell  style="font-size: smaller;font-weight: bold;" *matHeaderCellDef> Line Num </mat-header-cell>
                        <mat-cell style="font-size: smaller;" *matCellDef="let element"> {{element.Segment}} </mat-cell>
                      </ng-container>

                    <!-- Error Column -->
                      <ng-container matColumnDef="Error">
                        <mat-header-cell style="font-size: smaller;font-weight: bold;" *matHeaderCellDef> Errors </mat-header-cell>
                        <mat-cell style="font-size: smaller;" *matCellDef="let element"> {{element.Error}} </mat-cell>
                      </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row style="font-size: smaller; font-family: 'Courier New', Courier, monospace;"
                  *matRowDef="let row; let idx = index; columns: displayedColumns;"
                  [style.background-color]="rowClicked == idx ? 'turquoise' : 'azure'"
                (click)="OnErrorRowClick(row, idx)">
                </mat-row>

                </table>
                <div>


                  <mat-paginator [length]="errPageLength"  #errPaginator="matPaginator"
                  [pageSize]=errPageSize
                  [pageSizeOptions]="[5, 10, 25]"
                  (page)="onErrPaginateChange($event)">

                  </mat-paginator>
                </div>

            </td>
            <td style="vertical-align: top;">

              <!-- DATA -->


              <table  id="wftab" mat-table [dataSource]="dataSource" multiTemplateDataRows matSort
                *ngIf="canRenderDetails && dataSource.data.length > 0"
               style="font-size: small; font-family:sans-serif; border-style: groove;border-width: thin; font-size: small; background-color: azure;"
               >

                <ng-container [matColumnDef]="column" *ngFor="let column of dataTableKey; let i = index">
                  <th style="font-size: smaller;" class="mat-header-cell" *matHeaderCellDef mat-sort-header>
                    {{dataTableLabel[i]}} </th>
                  <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                </ng-container>


                <tr mat-header-row *matHeaderRowDef="dataTableKey;sticky: true" >
                </tr>

                <tr style="font-size: smaller; font-family:'Courier New', Courier, monospace;height: 10pt; "
                mat-row [ngClass]="{'make-gold': row.error !== '', 'selected': !checked && row.lnNum === selectedRow}"
                class="trans-element-row" *matRowDef="let row; columns: dataTableKey;" (click)="OnRowClick(row)"
                >
                </tr>


              </table>
              <div>


                <mat-paginator [length]="pageLength"  #dataPaginator="matPaginator"
                [pageIndex]="pageIndex" [pageSize]="pageSize"
                [pageSizeOptions]="[25, 50, 100]"
                (page)="onPaginateChange($event)">

                </mat-paginator>
              </div>

            </td>
          </tr>
        </table>



        <div> # of Segments  {{dataSource.data.length}}</div>
        <div *ngIf="canRenderDetails && dataSource.data.length === 0">No records found for {{f.transType.value}} </div>


  </div>
</form>
